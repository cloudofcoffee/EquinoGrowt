<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/img/EquinoGrowt.svg" />
  <link href="/src/style.css" rel="stylesheet">
  <link rel="manifest" href="/manifest.json">

  <title>EquinoGrowt</title>
</head>

<body>
  <div id="pwa-popup"
    class="fixed bottom-24 left-1/2 transform -translate-x-1/2 w-11/12 max-w-sm bg-[#146b60] text-white p-4 rounded-2xl shadow-xl text-center transition-all duration-300 invisible opacity-0 z-50 md:left-6 md:translate-x-0 md:bottom-6">

    <!-- Botón cerrar -->
    <button id="close-popup" class="absolute top-2 right-3 text-white text-base hover:text-gray-200">
      <i class="fas fa-times"></i>
    </button>

    <!-- Contenido -->
    <div class="flex flex-col items-center">
      <i class="fas fa-download text-3xl mb-2 text-white drop-shadow-sm"></i>
      <h2 class="text-lg font-bold">¿Querés instalar la app?</h2>
      <p class="text-sm opacity-90 mt-1">Accedé más rápido desde tu pantalla de inicio</p>
      <button id="install-btn"
        class="mt-3 bg-white text-[#146b60] px-4 py-2 text-sm font-semibold rounded-full w-full justify-center shadow-md hover:bg-gray-100 transition flex items-center gap-2">
        <i class="fa-solid fa-mobile-screen-button"></i> Instalar
      </button>
    </div>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>

  <!-- Logica Pop Up  -->
  <script>
    let evento;

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js')
        .then(() => console.log("Service Worker registrado"))
        .catch((error) => console.error("Error registrando el Service Worker", error));
    }

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      evento = e;

      const popup = document.getElementById("pwa-popup");
      popup.classList.remove("invisible", "opacity-0");
    });

    document.getElementById("install-btn").addEventListener("click", () => {
      if (evento) {
        evento.prompt();
      }
    });

    document.getElementById("close-popup").addEventListener("click", () => {
      document.getElementById("pwa-popup").classList.add("opacity-0", "invisible");
    });

    window.addEventListener("appinstalled", () => {
      console.log("PWA instalada");
      document.getElementById("pwa-popup").classList.add("opacity-0", "invisible");
    });
  </script>
</body>

</html>
